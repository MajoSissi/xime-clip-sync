<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xime Clip Sync · WebDAV 剪贴板同步</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #16181d;
    --panel: #1e2128;
    --panel-2: #242832;
    --border: #323846;
    --border-soft: #2a2f3a;
    --text: #e6e9ef;
    --text-dim: #98a1b3;
    --text-faint: #6f7a8c;
    --accent: #4c8dff;
    --accent-hover: #6aa1ff;
    --ok: #35c47a;
    --warn: #e5a13a;
    --err: #ef5f5f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
  }

  /* ---------- 顶栏：标题 · 状态 · 操作（第一行） ---------- */
  .topbar { position: sticky; top: 0; z-index: 10; }
  .bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 11px 24px;
    background: var(--panel);
  }
  .bar h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
  /* 三个高频动作固定在右上角 */
  .bar .actions { margin-left: auto; }

  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text-dim);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); flex: 0 0 auto; }
  .state-ok { color: var(--ok); border-color: rgba(53,196,122,.4); }
  .state-ok .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .state-error { color: var(--err); border-color: rgba(239,95,95,.4); }
  .state-error .dot { background: var(--err); }
  .state-backoff { color: var(--warn); border-color: rgba(229,161,58,.4); }
  .state-backoff .dot { background: var(--warn); }

  /* ---------- 页签：自成一行，底色比顶栏深一档 + 分隔线，和顶栏明确隔开 ---------- */
  .tabs {
    display: flex; gap: 2px; padding: 0 24px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .tabs button {
    padding: 9px 16px 7px; border: 0; border-radius: 0;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    background: transparent; color: var(--text-dim);
    font-size: 13px; font-weight: 500;
  }
  .tabs button:hover { background: var(--panel); color: var(--text); }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }

  /* ---------- 页面：一次只显示一页，每页若干张卡片 ---------- */
  .page {
    display: none; gap: 16px; align-items: start;
    padding: 18px 24px 24px;
  }
  .page.active { display: grid; }
  /* 同步设置：两张等宽卡片 */
  .page.sync { grid-template-columns: repeat(2, minmax(320px, 1fr)); }
  /* 程序设置：三张卡片一张一行，各按内容撑高。
     早先这里是让「启动与日志」跨两行 + align-self:stretch，靠拉伸去填满右列——
     可那张卡片只有两行内容，拉完底下空出 125px，卡片里的空白比内容还多。
     三列各占一格之后每张卡片都是自然高度，多出来的空档留在页面上、不在卡片里，
     整页也从 386px 收到 237px。 */
  .page.app { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  /* 运行状态：左边状态卡片收窄，把宽度让给日志（日志行又长又多） */
  .page.status { grid-template-columns: minmax(340px, 460px) minmax(0, 1fr); }
  @media (max-width: 1020px) {
    .page.sync, .page.app, .page.status { grid-template-columns: minmax(0, 1fr); }
  }

  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    min-width: 0;
  }
  h2 {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; margin: 0 0 14px; font-weight: 600;
    color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em;
  }
  h2::before {
    content: ""; width: 3px; height: 12px; border-radius: 2px;
    background: var(--accent); opacity: .75; flex: 0 0 auto;
  }

  /* ---------- 表单 ---------- */
  .fields { display: flex; flex-direction: column; gap: 13px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { min-width: 0; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  .help { font-size: 11.5px; color: var(--text-faint); margin-top: 6px; line-height: 1.6; }
  .help code {
    font-family: Consolas, "Cascadia Mono", monospace; font-size: 11px;
    color: #a9b6cc; background: var(--panel-2); border-radius: 4px; padding: 1px 4px;
  }
  .help a { color: var(--accent); text-decoration: none; word-break: break-all; }
  .help a:hover { text-decoration: underline; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; padding: 8px 10px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px;
    font: inherit; font-size: 13px; outline: none;
    transition: border-color .12s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input:disabled { opacity: .45; }
  select { cursor: pointer; }

  .checks { display: grid; gap: 10px; }
  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0; }
  .check input { width: 15px; height: 15px; accent-color: var(--accent); flex: 0 0 auto; cursor: pointer; }
  .check .lbl { font-size: 13px; color: var(--text); }

  /* ---------- 按钮 ---------- */
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  /* 分组用的竖线：左边是「保存并应用」，右边是「推送/拉取」 */
  .sep { width: 1px; height: 20px; flex: 0 0 auto; background: var(--border); margin: 0 2px; }
  button {
    padding: 8px 14px; border-radius: 7px; font: inherit; font-size: 13px;
    font-weight: 500; cursor: pointer; white-space: nowrap;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border);
    transition: background .12s, border-color .12s, color .12s;
  }
  button:hover { background: #2c313d; border-color: #3d4455; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* 卡片内的操作区：和上面的字段用一条虚线分界。
     position: relative 是给下面「测试连接」的提示条当定位基准用的。 */
  .card-actions {
    position: relative;
    margin-top: 14px; padding-top: 14px;
    border-top: 1px dashed var(--border);
    display: flex; align-items: center; gap: 10px;
  }

  /* ---------- 提示条 ---------- */
  .toast {
    padding: 9px 12px; border-radius: 8px; font-size: 12.5px;
    display: none; border: 1px solid transparent; word-break: break-word;
  }
  .toast.show { display: block; }
  .toast.ok { background: rgba(53,196,122,.12); border-color: rgba(53,196,122,.35); color: #7ee0aa; }
  .toast.bad { background: rgba(239,95,95,.12); border-color: rgba(239,95,95,.35); color: #ff9b9b; }

  /* 顶栏三个按钮的反馈：浮在右上角按钮正下方，不占布局、不推挤内容 */
  #toast {
    position: absolute; top: calc(100% + 10px); right: 24px; z-index: 30;
    max-width: min(420px, calc(100vw - 48px));
    box-shadow: 0 10px 28px rgba(0,0,0,.5);
  }
  #toast.ok { background: #16281f; border-color: rgba(53,196,122,.45); }
  #toast.bad { background: #2b1a1c; border-color: rgba(239,95,95,.45); }

  /* 「测试连接」的结果跟在按钮右边，同一行右对齐。
     这里**故意**用绝对定位：提示条一旦参与布局，出现/消失就会把整张卡片撑高又缩回去，
     点一下按钮卡片跳一下，很别扭。绝对定位 + 单行省略 → 卡片高度恒定不变。
     完整文案放在 title 里，鼠标悬停能看到，不用为长错误信息牺牲版面稳定。 */
  .card-actions .toast {
    position: absolute; top: 50%; right: 0; transform: translateY(-50%);
    margin: 0; max-width: calc(100% - 110px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 嵌在卡片里的告警（hash 不一致）自己占一行 */
  section .toast { margin: 12px 0 0; max-width: 100%; }

  /* ---------- 状态 ---------- */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* 计数器从 3 个变成 4 个：用 auto-fit，宽了排成一行、窄了自动折成两行，
     不用为「多一个格子」再调一次断点。 */
  .stats.counters { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); margin-top: 10px; }
  .stat {
    background: var(--panel-2); border: 1px solid var(--border-soft);
    border-radius: 8px; padding: 9px 12px; min-width: 0;
  }
  .stat .k { font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .v { font-size: 14px; font-weight: 600; margin-top: 3px; word-break: break-all; }

  .previews { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .preview {
    background: var(--panel-2); border: 1px solid var(--border-soft);
    border-radius: 8px; padding: 9px 12px; min-width: 0;
  }
  /* 标题一行：左边「本地内容 / 远端内容」，右边靠右给出这一侧的规模
     （文本多少字符、图片多少字节）。判断「同步过去的是不是这一份」
     靠的就是这个数，所以它一直在，哪怕内容是图片。 */
  .preview .head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; margin-bottom: 5px;
  }
  .preview .k { font-size: 11px; color: var(--text-faint); }
  .preview .meta {
    font-size: 11px; color: var(--text-faint);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  /* 内容已经在服务端按 150 字符截断了，高度天然有界，
     所以这里不再加 max-height —— 否则会多出一个「明明没多少字却要滚」的滚动条。 */
  .preview .v {
    font-size: 12.5px; font-family: Consolas, "Cascadia Mono", monospace;
    white-space: pre-wrap; word-break: break-all; color: #c9d2e3;
  }
  /* 图片直接画出来。max-width + max-height 双约束、宽高 auto，
     浏览器会等比缩放到框内，多宽的图都不会撑破卡片。
     [hidden] 必须显式写：上面的 display:block 特异性比 UA 的 [hidden] 高，
     不补这一条的话「没有图」时也会占一块位置。 */
  .preview .shot {
    display: block; margin-top: 2px;
    max-width: 100%; max-height: 240px; width: auto; height: auto;
    border: 1px solid var(--border); border-radius: 6px; background: #0d0f14;
    cursor: zoom-in;
  }
  .preview .shot[hidden] { display: none; }
  .preview .v[hidden] { display: none; }

  /* ---------- 日志 ---------- */
  /* 「运行状态」页只放同步日志——这一页是查「剪贴板为什么没同步过去」的地方。
     程序日志（配置、界面、托盘）照常写进 logs/ 下的 .app.log，只是不上界面。 */
  .logs {
    height: clamp(260px, calc(100vh - 240px), 720px);
    overflow-y: auto; resize: vertical;
    background: #12141a; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 12px; line-height: 1.7;
  }
  .logs .ln { white-space: pre-wrap; word-break: break-all; }
  .logs .t { color: #5f6b80; }
  .logs .info { color: #a9b6cc; }
  .logs .warn { color: var(--warn); }
  .logs .error { color: #ff8b8b; }
  .logs:empty::after { content: "暂无日志"; color: #4d586b; }
</style>
</head>
<body>
<div class="topbar">
  <div class="bar">
    <h1>Xime Clip Sync</h1>
    <span id="state" class="pill state-stopped"><span class="dot"></span><span id="stateText">加载中…</span></span>
    <div class="actions">
      <button id="btnPush">推送</button>
      <button id="btnPull">拉取</button>
      <span class="sep"></span>
      <button class="primary" id="btnSave">保存并应用</button>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button id="tab-sync"   role="tab" aria-selected="true">同步设置</button>
    <button id="tab-status" role="tab" aria-selected="false">运行状态</button>
    <button id="tab-app"    role="tab" aria-selected="false">程序设置</button>
  </nav>
  <div id="toast" class="toast"></div>
</div>

<main>
  <!-- ================= 页一：连接配置 + 同步行为 ================= -->
  <div class="page sync active" id="page-sync">

    <section>
      <h2>连接配置</h2>
      <div class="fields">
        <div class="field">
          <label for="davUrl">WebDAV 服务器地址</label>
          <input type="text" id="davUrl" placeholder="https://dav.jianguoyun.com/dav/">
        </div>
        <div class="field">
          <label for="remotePath">远程路径</label>
          <input type="text" id="remotePath" placeholder="xime/clipboard/current.json">
          <div class="help">
            远端文件路径，具体到文件，留空则为「xime/clipboard/current.json」
          </div>
        </div>        <div class="row">
          <div class="field">
            <label for="username">用户名</label>
            <input type="text" id="username" autocomplete="off">
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input type="password" id="password" autocomplete="new-password">
          </div>
        </div>
        <div class="field">
          <label for="deviceName">本机设备名</label>
          <input type="text" id="deviceName" placeholder="my-pc">
        </div>
        <label class="check">
          <input type="checkbox" id="insecureSkipVerify">
          <span class="lbl">跳过 TLS 证书校验</span>
        </label>
      </div>
      <div class="card-actions">
        <button id="btnTest" title="顺便在远端建好所需目录（剪贴板目录 + blobs 附件目录），之后同步就不必再建">测试连接</button>
        <div id="testToast" class="toast"></div>
      </div>
    </section>

    <section>
      <h2>同步行为</h2>
      <div class="fields">
        <label class="check">
          <input type="checkbox" id="enabled">
          <span class="lbl">启用同步</span>
        </label>
        <label class="check">
          <input type="checkbox" id="syncImages">
          <span class="lbl">同步图片（截图 / 位图，按 PNG 原图同步）</span>
        </label>
        <div class="row">
          <div class="field">
            <label for="maxTextChars">[文本] 自动推送-长度上限（字符）</label>
            <input type="number" id="maxTextChars" min="0" step="100" title="0 表示不限制">
          </div>
          <div class="field">
            <label for="manualMaxTextChars">[文本] 手动推送-长度上限（字符）</label>
            <input type="number" id="manualMaxTextChars" min="0" step="100"
                   title="托盘与右上角「推送」按钮用它，可以突破左边那个上限；0 表示不限制">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="maxImageMB">[图片] 自动推送-单张上限（MB）</label>
            <input type="number" id="maxImageMB" min="0" max="50" step="1" title="0 表示不限制；最高 50">
          </div>
          <div class="field">
            <label for="manualMaxImageMB">[图片] 手动推送-单张上限（MB）</label>
            <input type="number" id="manualMaxImageMB" min="0" max="50" step="1"
                   title="托盘与右上角「推送」按钮用它，可以突破左边那个上限；0 表示不限制；最高 50">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="pollSeconds">远端轮询间隔（秒）</label>
            <input type="number" id="pollSeconds" min="3" max="3600">
          </div>
          <div class="field">
            <label for="localPollSeconds">本地检查间隔（秒）</label>
            <input type="number" id="localPollSeconds" min="1" max="60">
          </div>
        </div>
      </div>
    </section>

  </div>

  <!-- ================= 页二：运行状态 + 同步日志 ================= -->
  <div class="page status" id="page-status">

    <section>
      <h2>运行状态</h2>
      <div class="stats">
        <div class="stat"><div class="k">最后推送</div><div class="v" id="lastPush">—</div></div>
        <div class="stat"><div class="k">最后拉取</div><div class="v" id="lastPull">—</div></div>
      </div>
      <div class="stats counters">
        <div class="stat"><div class="k">推送次数</div><div class="v" id="pushCount">0</div></div>
        <div class="stat"><div class="k">应用远端</div><div class="v" id="pullCount">0</div></div>
        <div class="stat"><div class="k">文本超限</div><div class="v" id="oversizeCount">0</div></div>
        <div class="stat"><div class="k">图片超限</div><div class="v" id="imageOversizeCount">0</div></div>
      </div>

      <div class="previews">
        <div class="preview">
          <div class="head">
            <span class="k">本地内容</span>
            <span class="meta" id="localMeta"></span>
          </div>
          <div class="v" id="localText">—</div>
          <img class="shot" id="localShot" alt="本地图片" hidden>
        </div>
        <div class="preview">
          <div class="head">
            <span class="k">远端内容</span>
            <span class="meta" id="remoteMeta"></span>
          </div>
          <div class="v" id="remoteText">—</div>
          <img class="shot" id="remoteShot" alt="远端图片" hidden>
        </div>
      </div>

      <div id="hashWarn" class="toast bad"></div>
    </section>

    <!-- 只有同步日志：剪贴板的推与拉、连接测试、限流退避、上传下载失败。
         程序自身的日志（配置、界面、托盘）一律不往这块里放。 -->
    <section>
      <h2>同步日志</h2>
      <div id="syncLogs" class="logs"></div>
    </section>

  </div>

  <!-- ======== 页三：程序设置（启动与日志 + 配置界面 + 网络代理） ======== -->
  <div class="page app" id="page-app">

    <section>
      <h2>启动与日志</h2>
      <div class="fields">
        <div class="checks">
          <label class="check">
            <input type="checkbox" id="autostart">
            <span class="lbl">开机自动启动</span>
          </label>
          <label class="check">
            <input type="checkbox" id="logToFile">
            <span class="lbl">日志写入文件</span>
          </label>
        </div>
        <div class="row">
          <div class="field">
            <label for="logRetainDays">日志保留天数</label>
            <input type="number" id="logRetainDays" min="0" max="365" title="0 表示永久保留">
          </div>
          <div class="field">
            <label for="logMaxFileMB">单个日志文件上限（MB）</label>
            <input type="number" id="logMaxFileMB" min="0" max="1024" title="0 表示不限制">
          </div>
        </div>
      </div>
    </section>

    <section>
      <h2>配置界面</h2>
      <div class="fields">
        <div class="field">
          <label for="uiPort">监听端口</label>
          <input type="number" id="uiPort" min="1" max="65535" title="保存后立即生效；新端口被占用时会提示你改配置文件再重启">
          <div class="help">当前地址：<a id="uiUrl" href="/"></a></div>
        </div>
      </div>
    </section>

    <!-- 代理放在「程序设置」里，不放「连接配置」：它管的是程序**怎么出网**，
         跟服务器地址/账号密码不是一类东西；而且多数人用默认的「系统代理」就够了，
         摆在连接配置里会和必填项混在一起，看起来像「还得再填一项才能用」。 -->
    <section>
      <h2>网络代理</h2>
      <div class="fields">
        <div class="row">
          <div class="field">
            <label for="proxyMode">代理</label>
            <select id="proxyMode">
              <option value="system">系统代理</option>
              <option value="http">HTTP 代理</option>
              <option value="socks5">SOCKS5 代理</option>
              <option value="none">不代理</option>
            </select>
          </div>
          <div class="field">
            <label for="proxyUrl">代理地址</label>
            <input type="text" id="proxyUrl" placeholder="127.0.0.1:7890"
                   title="只填 host:port，不用写 http:// 或 socks5://；选「系统代理」「不代理」时这一项不生效">
          </div>
        </div>
      </div>
      <div class="help">
        只影响本程序访问 WebDAV 服务器的流量。「系统代理」读的是 Windows 的
        「Internet 选项 → 连接 → 局域网设置」，改完系统设置后这里不用再动。
      </div>
    </section>

  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);

const FIELDS = ["davUrl","remotePath","username","password","deviceName","pollSeconds",
                "localPollSeconds","maxTextChars","manualMaxTextChars",
                "syncImages","maxImageMB","manualMaxImageMB","enabled","insecureSkipVerify",
                "proxyMode","proxyUrl",
                "autostart","logToFile","logRetainDays","logMaxFileMB","uiPort"];
const BOOLS = ["enabled","syncImages","insecureSkipVerify","autostart","logToFile"];
const NUMS = ["pollSeconds","localPollSeconds","maxTextChars","manualMaxTextChars",
              "maxImageMB","manualMaxImageMB","logRetainDays","logMaxFileMB","uiPort"];
const TABS = ["sync","status","app"];

// 把文本放进 innerHTML 前转义。提示文案里可能夹着系统错误信息，
// 里面出现 < > & 会破坏页面结构。
function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

// 把字节数渲染成「12 KB / 1.5 MB」这样的短标签（状态区显示图片体积用）。
// 与后端的 humanBytes 口径一致，只是这里保留一位小数，避免 1.5 MB 被显示成 1 MB。
function fmtBytes(n) {
  n = Number(n) || 0;
  if (n >= 1048576) return (n / 1048576).toFixed(1).replace(/\.0$/, "") + " MB";
  if (n >= 1024) return Math.round(n / 1024) + " KB";
  return n + " B";
}

// 顶栏操作（保存 / 推送 / 拉取）的反馈：浮在按钮下方，6 秒后自己消失。
function toast(msg, ok) {
  const el = $("toast");
  el.textContent = msg;
  el.className = "toast show " + (ok ? "ok" : "bad");
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = "toast"; }, 6000);
}

// 卡片内按钮的反馈：就地显示在按钮右边，不跳到顶栏去。
//
// 提示条是绝对定位的单行条（见 .card-actions .toast），长了会省略号截断，
// 所以完整文案挂在 title 上，鼠标悬停就能看全 —— 既保住卡片高度不变，也不丢信息。
function inlineToast(id, msg, ok, ms) {
  const el = $(id);
  el.textContent = msg;
  el.title = msg;
  el.className = "toast show " + (ok ? "ok" : "bad");
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = "toast"; }, ms);
}

function testToast(msg, ok) { inlineToast("testToast", msg, ok, 10000); }

// showTab 切换页签。选中的页签写进 URL hash，
// 这样刷新（SSE 重连、改端口后重开）还能停在原来那一页。
function showTab(name) {
  if (!TABS.includes(name)) name = TABS[0];
  for (const t of TABS) {
    $("tab-" + t).setAttribute("aria-selected", t === name ? "true" : "false");
    $("page-" + t).classList.toggle("active", t === name);
  }
  if (location.hash.slice(1) !== name) history.replaceState(null, "", "#" + name);
  // 日志框在隐藏状态下量不出高度，切回来时补一次滚到底
  if (name === "status") {
    const box = $("syncLogs");
    box.scrollTop = box.scrollHeight;
  }
}

// 代理地址只在「HTTP 代理 / SOCKS5 代理」下有意义，其余模式把它置灰。
// 留着可编辑会让人以为填了就生效——「系统代理」是去读系统设置，不看这个框。
function syncProxyField() {
  const needAddr = ["http", "socks5"].includes($("proxyMode").value);
  const el = $("proxyUrl");
  el.disabled = !needAddr;
  el.placeholder = needAddr ? "127.0.0.1:7890" : "当前代理模式不需要地址";
}

function fillForm(cfg) {
  for (const k of FIELDS) {
    const el = $(k);
    if (!el) continue;
    if (BOOLS.includes(k)) el.checked = !!cfg[k];
    else el.value = cfg[k] === undefined || cfg[k] === null ? "" : cfg[k];
  }
  // 密码是特例：服务端不回显任何密码材料，所以这里永远留空。
  // 保存时「留空」的语义是「不修改已保存的密码」——这条只能靠 placeholder 表达，
  // 否则用户会以为密码丢了。
  const pw = $("password");
  pw.value = "";
  pw.placeholder = cfg.passwordSaved ? "已保存，留空则不修改" : "请输入密码";
  syncProxyField();
}

function readForm() {
  const cfg = {};
  for (const k of FIELDS) {
    const el = $(k);
    if (!el) continue;
    if (BOOLS.includes(k)) cfg[k] = el.checked;
    else if (NUMS.includes(k)) cfg[k] = parseInt(el.value, 10) || 0;
    else cfg[k] = el.value;
  }
  return cfg;
}

async function api(path, body, method) {
  const opts = { method: method || (body ? "POST" : "GET") };
  if (body) {
    opts.headers = { "Content-Type": "application/json" };
    opts.body = JSON.stringify(body);
  }
  const resp = await fetch(path, opts);
  return resp.json();
}

// setShot 决定「要不要重新取这张图」。
//
// status 每 2 秒推一次，无脑重设 img.src 会让浏览器反复请求同一张图并闪一下。
// 哈希没变就什么都不做——URL 是按内容寻址的（见 /api/image），
// 同一个哈希必然同一张图，哈希变了才需要换。
function setShot(img, side, hash) {
  if (!hash) {
    img.hidden = true;
    img.removeAttribute("src");
    img.dataset.h = "";
    return;
  }
  if (img.dataset.h === hash) {
    img.hidden = false;
    return;
  }
  img.dataset.h = hash;
  img.hidden = false;
  img.src = "/api/image?side=" + side + "&h=" + encodeURIComponent(hash);
}

// renderSide 画「本地内容 / 远端内容」里的一侧。
//
//   kind === "image" → 直接画出原图，右上角标体积
//   kind === "text"  → 显示文本摘要，右上角标**完整**字符数
//   kind === ""      → 这一侧还没有内容，显示 o.empty
//
// 图片取不到时（服务端只有元数据、没下过原图）退回纯文字：
// 光留个空白框会让人以为是加载失败。
function renderSide(side, o) {
  const meta = $(side + "Meta");
  const box = $(side + "Text");
  const img = $(side + "Shot");

  if (o.kind === "image") {
    meta.textContent = fmtBytes(o.bytes);
    setShot(img, side, o.hash);
    box.hidden = !img.hidden;
    box.textContent = img.hidden ? "（未取到原图）" : "";
    return;
  }

  img.hidden = true;
  img.removeAttribute("src");
  img.dataset.h = "";
  box.hidden = false;
  if (o.kind === "text") {
    meta.textContent = o.chars + " 字符";
    box.textContent = o.text || "（空）";
    return;
  }
  meta.textContent = "";
  box.textContent = o.empty;
}

function renderStatus(st) {
  const pill = $("state");
  pill.className = "pill state-" + st.state;
  $("stateText").textContent = st.message || st.state;
  $("lastPush").textContent = st.lastPushAt || "—";
  $("lastPull").textContent = st.lastPullAt || "—";
  $("pushCount").textContent = st.pushCount;
  $("pullCount").textContent = st.pullCount;
  $("oversizeCount").textContent = st.oversizeCount || 0;
  $("imageOversizeCount").textContent = st.imageOversizeCount || 0;

  // 「内容」两块按类型渲染：文本看字符数，图片看体积 + 原图。
  renderSide("local", {
    kind: st.currentKind, text: st.currentText, chars: st.currentTextChars,
    bytes: st.currentImageBytes, hash: st.currentImageHash, empty: "—",
  });
  // 远端连文件都没有时 currentKind 之类的字段都没意义，一律按「空」渲染。
  renderSide("remote", {
    kind: st.remoteExists ? st.remoteKind : "", text: st.remoteText,
    chars: st.remoteTextChars, bytes: st.remoteImageBytes,
    hash: st.remoteImageHash, empty: "（远端暂无文件）",
  });

  // 配置界面地址跟着端口走，放在「程序设置 · 配置界面」里，可以点开/复制。
  const a = $("uiUrl");
  a.href = location.origin + "/";
  a.textContent = location.origin + "/";

  // 对端 hash 算法与本地不一致时给出提示（不影响同步，只作兼容性提醒）
  const hw = $("hashWarn");
  if (st.hashMismatch) {
    hw.className = "toast show bad";
    hw.textContent = "对端 hash 与本地 SHA-256 不一致（远端 " + st.remoteHash +
      " / 本地 " + st.localHash + "）。同步不受影响。";
  } else {
    hw.className = "toast bad";
    hw.textContent = "";
  }
}

// 日志面板最多保留多少行（服务端也是按这个数量给的）
const LOG_LIMIT = 300;

// 界面只展示同步通道，值必须与服务端 LogLine.kind 的 LogSync 一致。
//
// 程序日志（配置、界面、托盘、自启）照常写进 logs/ 下的 .app.log 供排查，
// 只是不占「运行状态」页——那一页是用来查「剪贴板为什么没同步过去」的。
const LOG_KIND = "sync";

// addLog 把一条日志放进面板；不属于本面板通道的直接丢掉。
function addLog(line) {
  if (line.kind !== LOG_KIND) return;
  const box = $("syncLogs");
  if (!box) return;
  const div = document.createElement("div");
  div.className = "ln";
  const t = document.createElement("span");
  t.className = "t";
  t.textContent = "[" + line.time + "] ";
  const c = document.createElement("span");
  c.className = line.level;
  c.textContent = line.text;
  div.append(t, c);
  box.appendChild(div);
  while (box.childElementCount > LOG_LIMIT) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

async function save() {
  const r = await api("/api/config/save", readForm());
  if (!r.ok) { toast(r.error || "保存失败", false); return; }

  // 端口改过之后，服务端会重新绑定监听，本页所在的端口随即失效。
  // 这时候必须把用户引导到新地址去，而不是让他对着一个死掉的页面刷新。
  //
  // 这里要连 warning 一起显示：换端口最常见的原因就是「填的端口用不了」，
  // 而本页马上要关了，用户看不到任何别的反馈——早先这里直接 return，
  // 那句「端口 X 不可用，已改用 Y」被吞掉，用户只看到地址变了、不知道为什么变。
  if (r.uiUrl && r.uiUrl !== location.origin + "/") {
    document.body.innerHTML =
      '<div style="padding:56px 24px;text-align:center;color:#98a1b3;line-height:2">' +
      '<div style="font-size:16px;color:#e6e9ef">配置已保存，配置界面已切换到新端口</div>' +
      '<div><a href="' + esc(r.uiUrl) + '" style="color:#4c8dff;font-size:15px">' + esc(r.uiUrl) + '</a></div>' +
      (r.warning ? '<div style="font-size:13px;color:#ff9b9b">' + esc(r.warning) + '</div>' : '') +
      '<div style="font-size:12px">本页所在的端口已经关闭，请打开上面的地址继续操作。</div>' +
      '</div>';
    return;
  }

  fillForm(r.config);
  if (r.warning) toast("配置已保存，但" + r.warning, false);
  else toast("配置已保存并生效", true);
}

async function init() {
  for (const t of TABS) $("tab-" + t).onclick = () => showTab(t);
  window.addEventListener("hashchange", () => showTab(location.hash.slice(1)));
  showTab(location.hash.slice(1));

  fillForm(await api("/api/config"));
  // /api/logs 两条通道都给，addLog 只挑同步通道那一份渲染
  const logs = await api("/api/logs");
  (logs.sync || []).forEach(addLog);

  const es = new EventSource("/api/events");
  es.addEventListener("status", (e) => renderStatus(JSON.parse(e.data)));
  es.addEventListener("log", (e) => addLog(JSON.parse(e.data)));

  $("btnSave").onclick = save;
  $("proxyMode").onchange = syncProxyField;
  $("btnTest").onclick = async () => {
    const btn = $("btnTest");
    btn.disabled = true;
    btn.textContent = "测试中…";
    try {
      const r = await api("/api/test", readForm());
      testToast(r.ok ? r.message : "连接失败：" + r.error, r.ok);
    } catch (e) {
      testToast("请求出错：" + e.message, false);
    } finally {
      btn.disabled = false;
      btn.textContent = "测试连接";
    }
  };
  $("btnPush").onclick = async () => {
    const r = await api("/api/push", {});
    toast(r.ok ? "已推送" : "推送失败：" + r.error, r.ok);
  };
  $("btnPull").onclick = async () => {
    const r = await api("/api/pull", {});
    toast(r.ok ? "已拉取" : "拉取失败：" + r.error, r.ok);
  };

  // Ctrl/Cmd + S 直接保存
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
      e.preventDefault();
      save();
    }
  });

  // 预览框里的图最多只有卡片那么宽（300 多像素），截图缩到那个尺寸看不清。
  // 点一下开原图——/api/image 返回的就是原尺寸 PNG。
  document.addEventListener("click", (e) => {
    const el = e.target;
    if (el && el.classList && el.classList.contains("shot") && el.src) {
      window.open(el.src, "_blank");
    }
  });
}

init();
</script>
</body>
</html>
